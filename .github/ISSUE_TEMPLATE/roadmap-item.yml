name: 🗺️ Item do roadmap
description: Item priorizável pelo motor de roadmap.
labels: ["roadmap"]
body:
  - type: dropdown
    id: categoria
    attributes:
      label: Categoria
      options: [feature, construcao, correcao, realismo, balanceamento, performance, saude-tecnica]
    validations: { required: true }
  - type: textarea
    id: problema
    attributes:
      label: Problema
      description: O que acontece hoje e por que vale mudar.
    validations: { required: true }
  - type: textarea
    id: pesquisa
    attributes:
      label: Pesquisa
      description: "Opcional em UI/tooling/refactor. Para regra, dado ou número factual da simulação, inclua a fonte."
  - type: textarea
    id: proposta
    attributes:
      label: Proposta
      description: Explique o benefício e como perceber que a mudança funcionou.
    validations: { required: true }
  - type: input
    id: metrica
    attributes:
      label: Métrica de sucesso
      description: "Formato: <id> <operador> <valor> ou teste <arquivo> para comportamento verificável."
    validations: { required: true }
  - type: input
    id: alcance
    attributes:
      label: Alcance
      description: Quantas pessoas da cidade são afetadas, quando essa medida fizer sentido.
    validations: { required: true }
  - type: dropdown
    id: impacto
    attributes:
      label: Impacto
      options: ["3 - vida ou morte", "2 - alto", "1 - médio", "0.5 - baixo", "0.25 - estética"]
    validations: { required: true }
  - type: dropdown
    id: confianca
    attributes:
      label: Confiança
      options: ["100 - dado do jogo + fonte real", "80 - evidência forte", "50 - hipótese/opinião"]
    validations: { required: true }
  - type: input
    id: esforco
    attributes:
      label: Esforço
      description: Estimativa relativa de esforço; não quebre artificialmente a mudança para preencher este campo.
  - type: input
    id: dependencias
    attributes:
      label: Dependências
      description: "Issues que realmente precisam vir antes. Ex.: #12, #15"
  - type: input
    id: sinal
    attributes:
      label: Sinal de origem
      description: Id de `npm run roadmap:signals`, se houver.
