name: branch hygiene

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-hygiene.yml
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

jobs:
  sweep-obsolete-branches:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Delete branches that are definitely obsolete
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t OPEN_HEADS < <(
            gh api --method GET "repos/$REPO/pulls"               -f state=open -f per_page=100 --paginate --jq '.[].head.ref'
          )

          is_open_head() {
            local branch="$1"
            for h in "${OPEN_HEADS[@]}"; do
              [[ "$branch" == "$h" ]] && return 0
            done
            return 1
          }

          delete_branch() {
            local branch="$1"
            local delete_error
            echo "DELETE $branch"
            if delete_error="$(gh api --silent --method DELETE "repos/$REPO/git/refs/heads/$branch" 2>&1)"; then
              return 0
            fi
            if [[ "$delete_error" == *"HTTP 404"* ]]; then
              echo "SKIP already gone $branch"
              return 0
            fi
            echo "$delete_error" >&2
            return 1
          }

          mapfile -t BRANCHES < <(
            gh api --method GET "repos/$REPO/branches"               -f per_page=100 --paginate --jq '.[].name'
          )

          for branch in "${BRANCHES[@]}"; do
            [[ "$branch" == "main" ]] && continue

            case "$branch" in
              poc/*|poc-*)
                echo "KEEP poc $branch"
                continue
                ;;
            esac

            if is_open_head "$branch"; then
              echo "KEEP open-pr $branch"
              continue
            fi

            if sha="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha' 2>&1)"; then
              :
            elif [[ "$sha" == *"HTTP 404"* ]]; then
              echo "SKIP vanished before inspection $branch"
              continue
            else
              echo "$sha" >&2
              exit 1
            fi
            ahead="$(gh api "repos/$REPO/compare/main...$sha" --jq '.ahead_by')"

            if [[ "$ahead" == "0" ]]; then
              delete_branch "$branch"
              continue
            fi

            # PR fechada + tip idêntico prova que a branch não recebeu trabalho novo desde o fechamento.
            # O histórico continua rastreável pela própria PR fechada; qualquer commit posterior impede a remoção.
            closed_tip="$(
              gh api --method GET "repos/$REPO/pulls"                 -f state=closed -f head="$OWNER:$branch" -f per_page=100                 --jq ".[] | select(.head.sha == \"$sha\") | .number"                 | head -n 1
            )"

            if [[ -n "$closed_tip" ]]; then
              echo "closed PR #$closed_tip owns current tip"
              delete_branch "$branch"
              continue
            fi

            echo "KEEP ambiguous $branch ahead=$ahead"
          done

  delete-merged-pr-branch:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main' &&
      !startsWith(github.event.pull_request.head.ref, 'poc/') &&
      !startsWith(github.event.pull_request.head.ref, 'poc-')
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged PR head branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          echo "DELETE merged PR branch $BRANCH"
          gh api --method DELETE "repos/$REPO/git/refs/heads/$BRANCH"
