name: POC visual preview

on:
  pull_request:

permissions:
  contents: write

jobs:
  preview:
    if: github.head_ref == 'poc/isometric-visual-refresh'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatar a POC
        run: npx biome format --write packages/web/src/pocVisual.ts packages/web/src/main.tsx packages/web/src/style.css
      - name: Montar cenário visual temporário
        shell: bash
        run: |
          cat > tests/e2e/poc-preview.tmp.spec.ts <<'TEST'
          import { expect, test } from "@playwright/test";

          declare global {
            interface Window {
              // biome-ignore lint/suspicious/noExplicitAny: ponte de depuração do jogo
              __city: any;
            }
          }

          test("galeria visual da POC", async ({ page }) => {
            const errors: string[] = [];
            page.on("pageerror", (e) => errors.push(e.message));
            await page.goto("/?seed=poc-gallery&modo=livre&visual=poc");
            await page.waitForFunction(() => window.__city?.store.get().ready, null, { timeout: 120_000 });
            await page.evaluate(() => {
              const c = window.__city.client;
              c.command({ type: "buildRoad", kind: "avenue", x0: 47, y0: 128, x1: 106, y1: 128 });
              for (const x of [60, 75, 90, 105])
                c.command({ type: "buildRoad", kind: "street", x0: x, y0: 110, x1: x, y1: 146 });
              c.command({ type: "placeService", service: "poco", x: 50, y: 129 });
              c.command({ type: "placeService", service: "subestacao", x: 53, y: 129 });
              c.command({ type: "placeService", service: "escola", x: 61, y: 129 });
              c.command({ type: "placeService", service: "ubs", x: 76, y: 129 });
              c.command({ type: "placeService", service: "hospital", x: 91, y: 129 });
              c.command({ type: "zone", zone: "residential_low", x0: 61, y0: 113, x1: 73, y1: 127 });
              c.command({ type: "zone", zone: "residential_high", x0: 76, y0: 113, x1: 88, y1: 127 });
              c.command({ type: "zone", zone: "commercial", x0: 91, y0: 113, x1: 103, y1: 127 });
              c.send({ type: "advance", ticks: 6200 });
              window.__city.renderer.lookAt(79, 128);
            });
            await page.waitForFunction(() => window.__city.buildings().length >= 5, null, { timeout: 120_000 });
            await page.waitForTimeout(1500);
            const shot = await page.screenshot({ path: "test-results/poc-gallery.png" });
            expect(shot.length).toBeGreaterThan(80_000);
            expect(errors).toEqual([]);
          });
          TEST
      - name: Capturar cenário da POC
        run: npx playwright test tests/e2e/poc-preview.tmp.spec.ts --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poc-visual-preview
          path: test-results/
          retention-days: 7
      - name: Build da POC para pacote local
        env:
          VITE_POC_VISUAL: "1"
        run: npm run build
      - name: Montar ZIP pronto para rodar
        shell: bash
        run: |
          set -euo pipefail
          ROOT="out/poc-package/CityBuilder-POC"
          rm -rf out/poc-package
          mkdir -p "$ROOT/jogo" "$ROOT/fonte"
          cp -a dist/. "$ROOT/jogo/"
          printf '%s\n' "${GITHUB_SHA}" > "$ROOT/VERSION.txt"
          cat > "$ROOT/LEIA-ME.txt" <<'TXT'
          CityBuilder — POC visual isométrica (#296)

          COMO RODAR
          Windows:
            1. Tenha Node.js 22 ou mais novo instalado.
            2. Dê duplo clique em INICIAR-POC.bat.
            3. Abra http://127.0.0.1:4173/ no navegador.

          macOS / Linux:
            1. Tenha Node.js 22 ou mais novo instalado.
            2. Rode: chmod +x INICIAR-POC.sh && ./INICIAR-POC.sh
            3. Abra http://127.0.0.1:4173/ no navegador.

          A build em jogo/ já vem com a POC visual ligada por padrão.
          Para comparar com o visual anterior, acrescente ?visual=legacy à URL.

          A pasta fonte/ contém o projeto correspondente à POC (sem node_modules).
          TXT
          cat > "$ROOT/rodar-poc.mjs" <<'NODE'
          import { createReadStream, existsSync, statSync } from "node:fs";
          import { createServer } from "node:http";
          import { extname, resolve } from "node:path";
          import { fileURLToPath } from "node:url";

          const root = resolve(fileURLToPath(new URL("./jogo/", import.meta.url)));
          const types = new Map([
            [".html", "text/html; charset=utf-8"],
            [".js", "text/javascript; charset=utf-8"],
            [".mjs", "text/javascript; charset=utf-8"],
            [".css", "text/css; charset=utf-8"],
            [".json", "application/json; charset=utf-8"],
            [".svg", "image/svg+xml"],
            [".png", "image/png"],
            [".jpg", "image/jpeg"],
            [".jpeg", "image/jpeg"],
            [".webp", "image/webp"],
            [".glb", "model/gltf-binary"],
            [".gltf", "model/gltf+json"],
            [".wasm", "application/wasm"],
          ]);

          createServer((req, res) => {
            const raw = decodeURIComponent((req.url ?? "/").split("?")[0] ?? "/");
            const rel = raw === "/" ? "index.html" : raw.replace(/^\/+/, "");
            let file = resolve(root, rel);
            if (!file.startsWith(root)) {
              res.writeHead(403);
              res.end("Forbidden");
              return;
            }
            if (existsSync(file) && statSync(file).isDirectory()) file = resolve(file, "index.html");
            if (!existsSync(file)) {
              res.writeHead(404);
              res.end("Not found");
              return;
            }
            res.setHeader("Content-Type", types.get(extname(file).toLowerCase()) ?? "application/octet-stream");
            res.setHeader("Cache-Control", "no-store");
            createReadStream(file).pipe(res);
          }).listen(4173, "127.0.0.1", () => {
            console.log("POC pronta em http://127.0.0.1:4173/");
            console.log("Ctrl+C encerra o servidor.");
          });
          NODE
          cat > "$ROOT/INICIAR-POC.bat" <<'BAT'
          @echo off
          cd /d "%~dp0"
          node rodar-poc.mjs
          pause
          BAT
          cat > "$ROOT/INICIAR-POC.sh" <<'SH'
          #!/usr/bin/env sh
          cd "$(dirname "$0")"
          exec node rodar-poc.mjs
          SH
          chmod +x "$ROOT/INICIAR-POC.sh"
          tar             --exclude='./.git'             --exclude='./node_modules'             --exclude='./dist'             --exclude='./out'             --exclude='./test-results'             --exclude='./playwright-report'             --exclude='./.github/workflows/poc-preview.yml'             -cf - . | tar -xf - -C "$ROOT/fonte"
          (cd out/poc-package && python3 -m zipfile -c ../CityBuilder-POC-visual.zip CityBuilder-POC)
      - uses: actions/upload-artifact@v4
        with:
          name: CityBuilder-POC-visual
          path: out/CityBuilder-POC-visual.zip
          retention-days: 7
