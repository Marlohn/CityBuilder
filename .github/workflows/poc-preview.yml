name: POC visual preview

on:
  pull_request:

permissions:
  contents: write

jobs:
  preview:
    if: github.head_ref == 'poc/isometric-visual-refresh'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatar a POC
        run: npx biome format --write packages/web/src/pocVisual.ts packages/web/src/main.tsx packages/web/src/style.css
      - name: Salvar formatação na branch
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/web/src/pocVisual.ts packages/web/src/main.tsx packages/web/src/style.css
            git commit -m "style: format refined visual POC"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Capturar cenário da POC
        run: npx playwright test tests/e2e/smoke.spec.ts --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poc-visual-preview
          path: test-results/
          retention-days: 7
