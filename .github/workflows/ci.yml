name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classificar mudança
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.paths.outputs.tests }}
      slow: ${{ steps.paths.outputs.slow }}
      e2e: ${{ steps.paths.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE="$PR_BASE_SHA"
            HEAD="$PR_HEAD_SHA"
          else
            BASE="$PUSH_BEFORE_SHA"
            HEAD="$PUSH_HEAD_SHA"
          fi
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then BASE="$(git rev-parse "$HEAD^")"; fi
          mapfile -t FILES < <(git diff --name-only "$BASE" "$HEAD")
          TESTS=false
          SLOW=false
          E2E=false
          if [[ "${#FILES[@]}" -eq 0 ]]; then TESTS=true; fi
          for FILE in "${FILES[@]}"; do
            case "$FILE" in
              *.md|docs/*|.agents/*|.github/ISSUE_TEMPLATE/*|.github/pull_request_template.md|.gitignore)
                ;;
              *) TESTS=true ;;
            esac
            case "$FILE" in
              packages/sim/*|packages/bots/*|packages/cli/*|packages/contract/*|config/*|data/*|tests/slow/*|package.json|package-lock.json|vitest.config.ts|.dependency-cruiser.cjs|tools/check.ts|.github/workflows/ci.yml)
                SLOW=true ;;
            esac
            case "$FILE" in
              packages/sim/*|packages/contract/*|packages/render/*|packages/ui/*|packages/web/*|config/*|data/*|tests/e2e/*|playwright.config.ts|package.json|package-lock.json|.github/workflows/ci.yml)
                E2E=true ;;
            esac
          done
          printf 'Arquivos alterados:\n'
          printf '  %s\n' "${FILES[@]}"
          echo "tests=$TESTS"
          echo "slow=$SLOW"
          echo "e2e=$E2E"
          echo "tests=$TESTS" >> "$GITHUB_OUTPUT"
          echo "slow=$SLOW" >> "$GITHUB_OUTPUT"
          echo "e2e=$E2E" >> "$GITHUB_OUTPUT"

  check:
    name: npm run check
    needs: classify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Conferir classificação
        run: test "${{ needs.classify.result }}" = success
      - name: Mudança sem código
        if: needs.classify.outputs.tests != 'true'
        run: echo "Sem código executável alterado; check completo dispensado."
      - uses: actions/checkout@v4
        if: needs.classify.outputs.tests == 'true'
      - uses: actions/setup-node@v4
        if: needs.classify.outputs.tests == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: needs.classify.outputs.tests == 'true'
      - name: Validar workflows e código
        if: needs.classify.outputs.tests == 'true'
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync } from "node:fs";
          import YAML from "yaml";
          for (const name of readdirSync(".github/workflows")) {
            if (!/\.ya?ml$/.test(name)) continue;
            YAML.parse(readFileSync(`.github/workflows/${name}`, "utf8"));
            console.log(`${name}: YAML OK`);
          }
          NODE
          npm run check

  acceptance-name-compat:
    name: testes de aceitação protegidos
    needs: check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Compatibilidade temporária com o ruleset da main
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        run: |
          test "$CHECK_RESULT" = success
          echo "O fluxo QA/Dev foi removido. Este nome existe apenas enquanto o ruleset antigo ainda o exige."

  slow:
    name: testes lentos (coorte IBGE e cidade de 50 mil)
    needs: classify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Conferir classificação
        run: test "${{ needs.classify.result }}" = success
      - name: Dispensar quando não afeta simulação/dados/performance
        if: needs.classify.outputs.slow != 'true'
        run: echo "Testes lentos não são relevantes para estes caminhos."
      - uses: actions/checkout@v4
        if: needs.classify.outputs.slow == 'true'
      - uses: actions/setup-node@v4
        if: needs.classify.outputs.slow == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: needs.classify.outputs.slow == 'true'
      - run: npm run test:slow
        if: needs.classify.outputs.slow == 'true'

  e2e:
    name: teste de tela (Playwright)
    needs: classify
    if: always()
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init --ipc=host
    timeout-minutes: 25
    steps:
      - name: Conferir classificação
        run: test "${{ needs.classify.result }}" = success
      - name: Dispensar quando não afeta jogo visual/integração
        if: needs.classify.outputs.e2e != 'true'
        run: echo "E2E não é relevante para estes caminhos."
      - uses: actions/checkout@v4
        if: needs.classify.outputs.e2e == 'true'
      - uses: actions/setup-node@v4
        if: needs.classify.outputs.e2e == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: needs.classify.outputs.e2e == 'true'
      - name: Conferir versão do Playwright
        if: needs.classify.outputs.e2e == 'true'
        run: node -e 'const actual=require("@playwright/test/package.json").version;if(actual!=="1.63.0")throw new Error(`imagem Playwright 1.63.0, pacote ${actual}`)'
      - run: npm run test:e2e
        if: needs.classify.outputs.e2e == 'true'
