name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classificar mudança
    runs-on: ubuntu-latest
    outputs:
      full_suite: ${{ steps.paths.outputs.full_suite }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        name: Decidir se precisa da suíte completa
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE="$PR_BASE_SHA"
            HEAD="$PR_HEAD_SHA"
          else
            BASE="$PUSH_BEFORE_SHA"
            HEAD="$PUSH_HEAD_SHA"
          fi
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            BASE="$(git rev-parse "$HEAD^")"
          fi

          mapfile -t FILES < <(git diff --name-only "$BASE" "$HEAD")
          FULL=false
          if [[ "${#FILES[@]}" -eq 0 ]]; then FULL=true; fi

          for FILE in "${FILES[@]}"; do
            case "$FILE" in
              AGENTS.md|README.md|.agents/*|docs/*|hermes/FACTORY.md|hermes/OPERACAO.md|hermes/harness/sincronizar_github.py|hermes/harness/testar_sinc.py|.github/workflows/branch-hygiene.yml|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE.md|.github/CODEOWNERS)
                ;;
              *)
                FULL=true
                break
                ;;
            esac
          done

          echo "Arquivos alterados:"
          printf '  %s\n' "${FILES[@]}"
          echo "full_suite=$FULL"
          echo "full_suite=$FULL" >> "$GITHUB_OUTPUT"

  static-check:
    name: tipos, estilo e camadas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cenários do guard OpenCode (sem rede ou LLM)
        run: python3 hermes/harness/testar_opencode_guard.py
      - name: Integridade do ciclo de produto (sem rede ou LLM)
        run: python3 hermes/harness/testar_factory.py
      - name: Cenários e mutantes do sincronizador (sem rede ou LLM)
        run: |
          python3 hermes/harness/testar_sinc.py hermes/harness/sincronizar_github.py --sem-rede
          python3 hermes/harness/mutantes.py
      - run: |
          npm run check -- --only=types
          npm run check -- --only=lint
          npm run check -- --only=layers

  tests:
    name: testes Vitest (${{ matrix.shard }}/2)
    needs: classify
    if: needs.classify.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --shard=${{ matrix.shard }}/2 --reporter=dot

  check:
    # O nome exigido pela proteção só passa se TODAS as partes passarem.
    name: npm run check
    needs: [classify, static-check, tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Conferir todas as partes
        env:
          FULL_SUITE: ${{ needs.classify.outputs.full_suite }}
          STATIC_RESULT: ${{ needs.static-check.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$STATIC_RESULT" = success
          if [[ "$FULL_SUITE" == "true" ]]; then
            test "$TESTS_RESULT" = success
          else
            test "$TESTS_RESULT" = skipped
            echo "Suíte Vitest completa dispensada: mudança exclusivamente operacional/documental."
          fi

  slow:
    name: testes lentos (coorte IBGE e cidade de 50 mil)
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: CI leve
        if: needs.classify.outputs.full_suite != 'true'
        run: echo "Testes lentos dispensados para mudança exclusivamente operacional/documental."
      - uses: actions/checkout@v4
        if: needs.classify.outputs.full_suite == 'true'
      - uses: actions/setup-node@v4
        if: needs.classify.outputs.full_suite == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: needs.classify.outputs.full_suite == 'true'
      - run: npm run test:slow
        if: needs.classify.outputs.full_suite == 'true'

  factory-startup:
    name: bootstrap da fábrica
    needs: classify
    if: needs.classify.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Conferir versão da imagem e do pacote
        run: |
          node -e 'const actual = require("@playwright/test/package.json").version; if (actual !== "1.63.0") throw new Error("Atualize também a imagem Playwright do CI: pacote " + actual); console.log("Playwright " + actual + ": imagem e pacote compatíveis");'
      - name: Bootstrap real da fábrica (Git, build e navegador, sem LLM)
        run: python3 hermes/harness/testar_factory_startup.py

  e2e-factory:
    name: testes de tela (fábrica)
    needs: classify
    if: needs.classify.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Conferir versão da imagem e do pacote
        run: |
          node -e 'const actual = require("@playwright/test/package.json").version; if (actual !== "1.63.0") throw new Error("Atualize também a imagem Playwright do CI: pacote " + actual); console.log("Playwright " + actual + ": imagem e pacote compatíveis");'
      - name: Rodar E2E da ponte da fábrica isoladamente
        env:
          E2E_FACTORY_ONLY: "1"
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prints-da-tela-factory
          path: |
            test-results/
            out/factory/**
            !out/factory/**/address.json

  e2e-shards:
    name: testes de tela (${{ matrix.shard }}/2)
    needs: classify
    if: needs.classify.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    # Mesmo Playwright do package-lock.json; browsers e dependências já instalados.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init --ipc=host
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Conferir versão da imagem e do pacote
        run: |
          node -e 'const actual = require("@playwright/test/package.json").version; if (actual !== "1.63.0") throw new Error("Atualize também a imagem Playwright do CI: pacote " + actual); console.log("Playwright " + actual + ": imagem e pacote compatíveis");'
      - name: Rodar E2E normais sem a ponte da fábrica
        env:
          E2E_EXCLUDE_FACTORY: "1"
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prints-da-tela-${{ matrix.shard }}
          path: |
            test-results/
            out/factory/**
            !out/factory/**/address.json

  e2e:
    name: teste de tela (Playwright)
    needs: [classify, factory-startup, e2e-factory, e2e-shards]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Conferir todas as partes
        env:
          FULL_SUITE: ${{ needs.classify.outputs.full_suite }}
          STARTUP_RESULT: ${{ needs.factory-startup.result }}
          FACTORY_RESULT: ${{ needs.e2e-factory.result }}
          E2E_RESULT: ${{ needs.e2e-shards.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$FULL_SUITE" == "true" ]]; then
            test "$STARTUP_RESULT" = success
            test "$FACTORY_RESULT" = success
            test "$E2E_RESULT" = success
          else
            test "$STARTUP_RESULT" = skipped
            test "$FACTORY_RESULT" = skipped
            test "$E2E_RESULT" = skipped
            echo "Playwright dispensado: mudança exclusivamente operacional/documental."
          fi

  acceptance-tests-protected:
    # O Dev não pode alterar testes de aceitação do QA (docs/PLANO.md seção 12).
    # Branches de dev começam com "dev/".
    name: testes de aceitação protegidos
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'dev/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar arquivos alterados
        env:
          HEAD_REF: ${{ github.head_ref }}
          # Commit do Dev. HEAD aqui é o merge do PR na main ATUAL: com ele, teste que entrou na main
          # depois do qa/N nascer aparecia como "alterado pelo Dev" (falso positivo no PR #46).
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "${{ github.base_ref }}"
          # O Dev parte da branch do QA (qa/<issue>): compara com ela, para só contar o que o Dev mudou.
          ISSUE="${HEAD_REF#dev/}"
          BASE="origin/${{ github.base_ref }}"
          if git fetch origin "qa/${ISSUE}" 2>/dev/null; then BASE="origin/qa/${ISSUE}"; fi
          echo "Comparando com ${BASE}"
          # Compare os CONTEUDOS dos dois commits, não o merge-base. Após rebase, o mesmo
          # teste do QA tem outro ancestral e o diff de três pontos acusa alteração falsa (#129).
          CHANGED=$(git diff --name-only "${BASE}" "${HEAD_SHA}" | grep -E '^tests/acceptance/' || true)
          # O Dev pode trazer arquivos de teste que ja estao na main (merge da main na branch dele).
          # Isso nao e alteracao do Dev: e o mesmo arquivo, byte a byte, que ja passou pela revisao.
          # So conta como violacao o que o Dev mudou de verdade em relacao a main.
          # O Dev pode trazer testes de OUTRAS branches qa/ (issue que depende de outra).
          # Byte a byte igual a qualquer qa/* significa que ele nao editou: veio no merge.
          git fetch origin "+refs/heads/qa/*:refs/remotes/origin/qa/*" || true
          VIOLACOES=""
          for f in $CHANGED; do
            if git diff --quiet "origin/${{ github.base_ref }}" "${HEAD_SHA}" -- "$f"; then
              echo "Ignorado (identico a main, veio no merge): $f"
              continue
            fi
            VIOLADO=0
            for q in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/qa/); do
              if git diff --quiet "$q" "${HEAD_SHA}" -- "$f"; then
                echo "Ignorado (identico a ${q}, veio no merge): $f"
                VIOLADO=1
                break
              fi
            done
            if [ "$VIOLADO" -eq 0 ]; then
              VIOLACOES="${VIOLACOES} $f"
            fi
          done
          if [ -n "$VIOLACOES" ]; then
            echo "O Dev alterou testes de aceitação do QA:"
            echo "$VIOLACOES"
            echo "Peça ao QA para ajustar o teste em outra branch (qa/...)."
            exit 1
          fi
