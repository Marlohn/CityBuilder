name: POC art v2 preview

on:
  pull_request:

permissions:
  contents: write

jobs:
  preview:
    if: github.head_ref == 'poc/isometric-art-direction-v2'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validar e capturar vitrine
        run: npx playwright test tests/e2e/poc-art-v2.spec.ts --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poc-art-v2-preview
          path: test-results/
          retention-days: 7
      - name: Build estático
        run: npm run build
      - name: Publicar preview isolado
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          LIVE="${RUNNER_TEMP}/citybuilder-poc-art-v2"
          rm -rf "$LIVE"
          mkdir -p "$LIVE"
          cp -a dist/. "$LIVE/"
          touch "$LIVE/.nojekyll"
          printf '%s\n' "${GITHUB_SHA}" > "$LIVE/VERSION.txt"
          cd "$LIVE"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b poc-art-v2-live
          git add .
          git commit -m "preview: art direction v2 ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin poc-art-v2-live
