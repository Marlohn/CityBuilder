name: Publicar POC visual

on:
  pull_request:

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'poc/isometric-visual-refresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Normalizar arquivos da POC
        run: npx biome check --write packages/web/src/pocVisual.ts packages/web/src/main.tsx packages/web/src/style.css
      - name: Build da POC
        env:
          VITE_POC_VISUAL: "1"
        run: npm run build
      - name: Publicar branch estática de preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          LIVE="${RUNNER_TEMP}/citybuilder-poc-live"
          rm -rf "$LIVE"
          mkdir -p "$LIVE"
          cp -a dist/. "$LIVE/"
          touch "$LIVE/.nojekyll"
          printf '%s\n' "${GITHUB_SHA}" > "$LIVE/VERSION.txt"
          cd "$LIVE"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b poc-visual-live
          git add .
          git commit -m "preview: visual POC ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin poc-visual-live
