# Saúde.
health:
  # Distância máxima até a UBS. PENDENTE: sem fonte oficial encontrada; usado o mesmo limite de caminhada da escola.
  maxDistanceMeters: 2000
  # Quem NÃO tem UBS: mortalidade maior. Municípios com cobertura da Saúde da Família acima de 70%
  # tiveram 36% menos mortes por doenças cardiovasculares (Rasella et al., BMJ 2014), e essas
  # doenças são ~30% dos óbitos no Brasil (Ministério da Saúde). 30% x 36% ≈ 11%.
  uncoveredMortalityMultiplier: 1.11
  # Portaria GM/MS 1.101/2002: 2,5 a 3 leitos para cada 1.000 habitantes.
  hospitalBedsPer1000: 2.5
  # PENDENTE: distância máxima por rodovia até o hospital. Usado 15 km: cerca de 30 min de viagem a 30 km/h,
  # o alvo de qualidade de acesso de cidades mediums.
  hospitalMaxDistanceMeters: 15000
  # PENDENTE: fração de redução da mortalidade de quem tem leito disponível. Usado 0,15.
  hospitalMortalityReduction: 0.15
  # Porte mínimo para a cidade ter hospital: 8.000 habitantes, o mesmo minPopulation do item
  # `hospital` em data/reference/cidade-real.yaml (Portaria GM/MS 1.101/2002: 2,5 a 3 leitos por
  # 1.000 habitantes; 2,5 x 8.000/1.000 = 20 leitos, o menor porte da classificação).
  hospitalMinPopulation: 8000
  # PENDENTE: número de pessoas fora do raio de hospitalMaxDistanceMeters que faz o prefeito pedir
  # hospital. Usado 500 (mesma ordem de grandeza do gatilho de UBS). A fonte oficial (Portaria
  # GM/MS 1.101/2002) fixa leitos por 1.000 habitantes, não um raio de acesso: este número conta
  # quem mora longe do hospital, não gente sem leito.
  hospitalMinUncovered: 500
  # Taxa de internação: 7 a 9% da população precisa internar no ano (Portaria GM/MS 1.101/2002),
  # meio do intervalo 7-9% = 8% (0,08).
  # https://bvsms.saude.gov.br/bvs/saudelegis/gm/2002/gm_1101_12_06_2002.html
  hospitalAdmissionRatePerYear: 0.08
  # Média de Permanência (indicador 5, ANS/Qualiss): média geral de 5,3 dias em hospitais
  # públicos em 2018 (DataSUS/ANS).
  # https://www.gov.br/ans/pt-br/arquivos/assuntos/prestadores/qualiss-programa-de-qualificacao-dos-prestadores-de-servicos-de-saude-1/Ficha_tecnica_indicador_5.pdf/@@download/file
  hospitalAvgLengthOfStayDays: 5.3
