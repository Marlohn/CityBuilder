# Trânsito. Veja docs/PLANO.md seção 5.7.
traffic:
  cars:
    # 48,1% dos domicílios tinham carro em 2023 (PNAD). A chance de ter carro cresce com a renda
    # mensal da família. Os pontos abaixo foram escolhidos para aproximar os 48%. PENDENTE: calibração.
    ownershipByHouseholdIncome: { "0": 0.08, "2000": 0.3, "4000": 0.55, "8000": 0.78, "15000": 0.92 }
    # Velocidade com que as famílias chegam ao equilíbrio (compra/venda por ano). PENDENTE: valor de jogo.
    yearlyTurnover: 0.3
    # PENDENTE: vagas de garagem por casa e por apartamento.
    parkingPerHome: 1
    # Vagas por emprego em comércio/indústria. PENDENTE.
    parkingPerJob: 0.3
  walking:
    # Caminhada utilitária média de 1,25 km (desvio 1,03 km) em Londrina (RBAFS). Aceitamos até
    # média + 1 desvio ≈ 2,3 km para ir ao trabalho a pé.
    maxWorkMeters: 2300
    speedKmh: 4.8
  # Função BPR (Bureau of Public Roads, 1964): tempo = tempo livre x (1 + 0,15 x (volume/capacidade)^4).
  bpr:
    alpha: 0.15
    beta: 4
  routine:
    # Janela de entrada no trabalho (minutos do dia, das 6h às 10h). A hora exata de cada
    # pessoa pesa pela curva tripsByHour abaixo. PENDENTE: distribuição dentro da janela.
    workStartMinute: [360, 600]
    # Jornada semanal (horas): média 38,4 h da população ocupada (PNAD Contínua via FGV IBRE 2024);
    # teto 44 h (Lei 5.764/1971, CLT art. 7º). PENDENTE: desvio da jornada semanal não tem fonte; valor de jogo.
    workHoursWeekly: { mean: 38.4, spread: 8 }
    # Teto da jornada semanal (horas). Lei 5.764/1971, CLT art. 7º (limite legal).
    maxHoursWeekly: 44
    # Dias úteis por semana, para converter a jornada semanal em jornada diária.
    # PENDENTE: fonte; 5 dias é a primeira aproximação do mundo do trabalho brasileiro.
    workdaysPerWeek: 5
    # Piso do expediente (minutos). PENDENTE: fonte; abaixo disso a pessoa não sai de casa.
    minMinutes: 60
    # Proporção de viagens por motivo. Pesquisa Origem-Destino 2017 da RMSP (Metrô, seção 3.3.9):
    # trabalho 18,5 mi (44%), educação 14,7 mi (35%), outros 8,8 mi (~21%).
    # As chaves shopping/health/leisure são a divisão do "other" entre as voltas novas (somam 1).
    # PENDENTE: a divisão de "outros" entre compras, saúde e lazer não tem fonte pública na OD.
    shareByPurpose: { work: 0.44, education: 0.35, other: 0.21, shopping: 0.4, health: 0.3, leisure: 0.3 }
    # Janela da volta de compras/saúde/lazer (minutos do dia, das 8h às 19h). A hora exata pesa
    # pela curva tripsByHour, igual à entrada no trabalho. PENDENTE: distribuição dentro da janela.
    errandStartMinute: [480, 1140]
    # Tempo de permanência no destino da volta (minutos). PENDENTE: sem fonte de tempo médio de
    # permanência em loja ou UBS; valores de jogo.
    errandStayMinutes: { shopping: 30, health: 60, leisure: 90 }
    # Distância máxima para resolver a volta a pé (metros). PENDENTE: valor de jogo, mesmo limite
    # da caminhada utilitária (maxWorkMeters).
    errandWalkMeters: 2300
    # Candidatos sorteados na busca do comércio/UBS mais próximo. PENDENTE: valor de jogo.
    errandCandidates: 40
    # Pesos por hora do dia das viagens. Pesquisa Origem-Destino 2017 da RMSP (Metrô, seção 3.3.11
    # "Flutuação horária"): três picos (manhã, meio-dia e fim da tarde). PENDENTE: os pesos são a
    # curva de três picos da OD 2017 lida de forma qualitativa, não a tabela numérica original
    # (https://www.mobilize.org.br/midias/pesquisas/pesquisa-origem-destino-2017-da-rmsp.pdf).
    tripsByHour: { "5": 1, "6": 14, "7": 32, "8": 24, "9": 4, "10": 2, "11": 6, "12": 15, "13": 7, "14": 5, "15": 6, "16": 10, "17": 20, "18": 14, "19": 6, "20": 3 }
    # Turno escolar da manhã: 7h às 12h. PENDENTE: distribuição de turnos.
    schoolStartMinute: 420
    schoolDurationMinutes: 300
    # Janela de escalonamento da ida à escola por pessoa (minutos). PENDENTE: distribuição de turnos.
    schoolStartSpreadMinutes: 10
  # Por quantas viagens a tela precisa guardar para desenhar (a tela lê o log a cada quadro;
  # o log é aparado quando estoura).
  tripLogMax: 80000
