# Economia. Veja docs/PLANO.md seção 5.5.
economy:
  # "budget" = com orçamento (pode ficar no vermelho); "sandbox" = dinheiro infinito.
  mode: budget
  # PENDENTE: valor de jogo. Dá para ruas, uma escola e uma UBS no começo.
  startingMoney: 40000000
  # Receita por habitante por ano varia com o porte da cidade (população -> R$ por
  # habitante por ano). Fora das pontas o valor repete a ponta (comportamento do
  # makeTableLookup): cidade até o primeiro ponto usa o primeiro valor, acima do
  # último ponto usa o último. A receita continua só em `impostos_e_repasses`.
  # Pontos poucos e bem espalhados porque o FPM é distribuído por coeficiente de
  # população escalonado por faixa e a interpolação linear faz o meio.
  # - "0" e "5000": 10886 -> R$ 10.886 por habitante/ano de receita externa, a
  #   maior parte FPM, valor que vale até ~5 mil habitantes. Os dois pontos existem
  #   para a interpolação manter esse número em toda a faixa com fonte real (o
  #   valor de 0 segura o começo da curva). Fonte: Gazeta do Povo, coluna de
  #   Paulo Übel:
  #   https://www.gazetadopovo.com.br/vozes/paulo-uebel/numero-de-municipios-no-brasil-deve-beneficiar-os-cidadaos-nao-os-politicos/
  #   (leitura de apoio: Jornal da USP/Rádio USP sobre municípios pequenos receberem
  #   mais recursos per capita que metrópoles:
  #   https://jornal.usp.br/radio-usp/municipios-pequenos-recebem-mais-recursos-per-capita-que-metropoles-com-maiores-desafios-urbanos/).
  # - "20000": PENDENTE, valor de jogo 8093 (média entre 10886 e 5300). O FPM é
  #   distribuído por coeficiente de população escalonado por faixa (Lei nº 8.443/1992,
  #   art. 88, 18 faixas do FPM-Interior; IBGE avisa que perder 1 habitante pode custar
  #   uma faixa inteira:
  #   https://www.ibge.gov.br/component/rsfiles/download-file/files.html?Itemid=6702&path=novoportal%252Fdocumentos_institucionais%252FEsclarecimentos_prestados_pela_DPE_estimativas_das_populacoes_municipais_20241018.pdf).
  # - "50000": PENDENTE, valor de jogo 6697 (média entre 8093 e 5300, os pontos de
  #   20.000 e 100.000).
  # - "100000": 5300 -> referência da média nacional: receita corrente R$ 1,077 trilhão
  #   em 2023 (Anuário Multi Cidades/FNP) para ~203 milhões de habitantes (Censo 2022)
  #   = ~R$ 5.300 por habitante por ano.
  revenuePerResidentByPopulation:
    "0": 10886
    "5000": 10886
    "20000": 8093
    "50000": 6697
    "100000": 5300
  income:
    # Rendimento médio mensal por escolaridade (PNAD 2024): sem instrução R$ 1.999; fundamental
    # completo R$ 2.660; superior completo R$ 6.177. PENDENTE: fundamental incompleto e médio
    # (interpolados). Média geral 2025: R$ 3.560.
    monthlyByEducation: [1999, 2300, 2660, 3100, 6177]
    # Variação individual (desvio padrão relativo). PENDENTE: valor de jogo.
    spread: 0.25
    # Salário mínimo 2026: R$ 1.621 (Decreto 12.797/2025). Usado também como aposentadoria mínima.
    minimumWage: 1621
  # PENDENTE: fração da renda gasta com o custo de vida.
  costOfLivingShare: 0.85
  # Mudar um serviço (escola, UBS) de lugar custa esta fração da obra. Como no Cities: Skylines II, a
  # mudança não é de graça. PENDENTE: fonte de custo real de relocação de prédio público.
  serviceMoveCostShare: 0.3
