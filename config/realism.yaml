# Placar de realismo: faixas aceitáveis vindas de dados reais. Veja docs/PLANO.md seção 9.
realism:
  # Só avalia quando a cidade tem pelo menos esta população (números pequenos variam demais).
  minPopulation: 1500
  # Amostra mínima (na janela) para avaliar cada indicador. Com poucos casos o número varia demais.
  minSamples:
    births: 300
    deaths: 150
    marriages: 40
    divorces: 20
  # Janela (em anos do jogo) usada nos indicadores de nascimento e morte.
  windowYears: 5
  items:
    - { id: lifeExpectancy, label: Expectativa de vida ao nascer, unit: anos, min: 70, max: 82, source: "IBGE 2023: 76,4 (H 73,1 / M 79,7)" }
    - { id: infantMortality, label: Mortalidade infantil, unit: por mil, min: 6, max: 20, source: "IBGE 2023: 12,5 por mil" }
    - { id: tfr, label: Filhos por mulher, unit: filhos, min: 1.3, max: 2.3, source: "IBGE 2023: 1,57 (UFs de 1,39 a 2,26)" }
    - { id: unemployment, label: Desemprego, unit: "%", min: 4, max: 15, source: "PNAD: 5,6% em 2025; série 2012-2025" }
    - { id: employmentLevel, label: Nível de ocupação, unit: "%", min: 50, max: 66, source: "PNAD 2025: 59,1%" }
    # Faixa: Censo 2010 (10,8%) até estados mais envelhecidos. PENDENTE: faixa por UF.
    - { id: pop60plus, label: Pessoas com 60 anos ou mais, unit: "%", min: 10, max: 22, source: "Censo 2022: 15,6%" }
    - { id: householdSize, label: Pessoas por domicílio, unit: pessoas, min: 2.3, max: 3.4, source: "Censo 2022: 2,79 (2010: 3,31)" }
    - { id: householdsWithCar, label: Domicílios com carro, unit: "%", min: 29, max: 70, source: "PNAD 2023: 48,1% (Nordeste 29,9% a Sul 69,2%)" }
    # Média nacional inclui metrópoles; cidade pequena tem trajetos curtos. Só avalia a partir de 50 mil
    # habitantes (PENDENTE: faixa por porte de cidade).
    - { id: commuteUnder30, label: Trabalhadores com trajeto de até 30 min, unit: "%", min: 55, max: 85, minPopulation: 50000, source: "Censo 2022: 67%" }
    - { id: marriageAgeMale, label: Idade média ao casar (homens), unit: anos, min: 27, max: 36, source: "IBGE Registro Civil 2023: 31,5" }
    - { id: marriageAgeFemale, label: Idade média ao casar (mulheres), unit: anos, min: 25, max: 34, source: "IBGE Registro Civil 2023: 29,2" }
    - { id: divorceRate, label: Divórcios por mil adultos (20+), unit: por mil, min: 1.5, max: 4.5, source: "IBGE 2023: 2,8" }
    - { id: higherEducation, label: Jovens 18-24 no ensino superior, unit: "%", min: 15, max: 45, source: "PNAD Educação 2023: 30,5%" }
    - { id: schoolEnrollment, label: Crianças 6-17 na escola, unit: "%", min: 90, max: 100, source: "PENDENTE: taxa de escolarização (PNAD Educação)" }
