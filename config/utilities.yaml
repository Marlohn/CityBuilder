# Água e luz. Veja docs/PLANO.md e a issue #15.
# Quem tem água e luz: as redes seguem as ruas (canos e postes ficam na via). Um prédio tem água se está
# na mesma malha de ruas de um poço/ETA com capacidade sobrando (mesma coisa para a luz e a subestação).
# Sem água ou luz ninguém se muda para o prédio, as empresas não contratam e a construtora não constrói ali.
utilities:
  enabled: true
  # Moradores por domicílio: 2,79 (Censo 2022, IBGE).
  personsPerHome: 2.79
  # Consumo de um emprego em "pessoas equivalentes". PENDENTE: fonte (consumo não residencial por emprego).
  personsPerJob: 0.5
  # Rede da região que chega pela estrada de acesso (adutora e linha da distribuidora), com capacidade
  # limitada: dá para uma cidade pequena; depois a cidade precisa de poço, ETA e subestação.
  # PENDENTE: valor de jogo.
  regionalWater: 4000
  regionalPower: 4000
  # Rede regional de esgoto que chega pela estrada de acesso, mesma ordem do regionalWater/regionalPower.
  # PENDENTE: valor de jogo.
  regionalSewage: 4000
  # Fração da água consumida que volta como esgoto: 0,8 (80%).
  # Fonte: ABNT NBR 9649 (coeficiente de retorno de 80% para dimensionamento de rede coletora),
  # mesma conta da Pesquisa Nacional de Saneamento Básico do IBGE (PNSB 2017):
  # "esgoto gerado = 80% da vazão de água consumida".
  # https://www.ibge.gov.br/estatisticas/multidominio/meio-ambiente/9117-pesquisa-nacional-de-saneamento-basico.html
  sewageShareOfConsumption: 0.8 # Fonte acima: ABNT NBR 9649 e IBGE PNSB 2017.
  # Recalcula a cada 60 ticks (1 hora do jogo).
  everyTicks: 60
  # Pessoas sem esgoto que fazem o prefeito pedir a ETE.
  # PENDENTE: limiar de jogo, sem fonte oficial.
  sewageMinUncovered: 300
