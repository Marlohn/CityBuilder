# Mapa. Veja docs/PLANO.md seção 5.1.
world:
  # 256 x 256 quadradinhos de 16 m = ~4,1 km de lado (~16,8 km²).
  # Na densidade de São Paulo (7.528 hab/km², IBGE Censo 2022) cabem ~126 mil pessoas.
  width: 256
  height: 256
  # Tamanho aproximado de um lote de casa (16 x 16 m = 256 m²).
  tileMeters: 16
  # Fração do mapa com vegetação nativa no início. PENDENTE: valor de jogo, sem fonte.
  treeCoverage: 0.18
  # Estrada de acesso que já existe no começo (como no Cities: Skylines): liga a cidade ao resto
  # do país. Sem ligação com a borda do mapa ninguém consegue chegar.
  startingRoad:
    enabled: true
    kind: avenue
    # Sai da borda oeste, na linha do meio do mapa.
    length: 48
  # Água no mapa: um rio que atravessa de norte a sul e alguns lagos (sorteados pela semente).
  # Rios e represas abastecem as cidades onde vivem 85% da população urbana (Atlas Águas 2021, ANA).
  # Tamanhos são valores de jogo. PENDENTE: fonte para largura típica de rio em cidade média.
  water:
    enabled: true
    # Largura do rio em quadradinhos (5 x 16 m = 80 m).
    riverWidth: 5
    # O rio fica no leste do mapa, longe da estrada de acesso (oeste), deixando espaço para a cidade.
    riverX: [0.8, 0.9]
    lakes: 3
    lakeRadius: [3, 7]
