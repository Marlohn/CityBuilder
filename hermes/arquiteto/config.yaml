# Perfil cb-arquiteto do CityBuilder. O modelo e as chaves você escolhe com: cb-arquiteto setup
# Troque o cwd pelo caminho ABSOLUTO do clone deste agente (cada agente tem o seu clone):
#   cb-arquiteto config set terminal.cwd /caminho/para/cb-arquiteto/CityBuilder
terminal:
  backend: local
  cwd: "."
agent:
  # Limite de passos por conversa. Um ciclo do papel cabe folgado aqui.
  max_turns: 150
