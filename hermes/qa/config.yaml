# Perfil cb-qa do CityBuilder. O modelo e as chaves você escolhe com: cb-qa setup
# Troque o cwd pelo caminho ABSOLUTO do clone deste agente (cada agente tem o seu clone):
#   cb-qa config set terminal.cwd /caminho/para/cb-qa/CityBuilder
terminal:
  backend: local
  cwd: "."
agent:
  # Limite de passos por conversa. Um ciclo do papel cabe folgado aqui.
  max_turns: 120
