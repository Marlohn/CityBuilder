# Perfil cb-dev do CityBuilder. O modelo e as chaves você escolhe com: cb-dev setup
# Troque o cwd pelo caminho ABSOLUTO do clone deste agente (cada agente tem o seu clone):
#   cb-dev config set terminal.cwd /caminho/para/cb-dev/CityBuilder
terminal:
  backend: local
  cwd: "."
agent:
  # Limite de passos por conversa. Um ciclo do papel cabe folgado aqui.
  max_turns: 200
