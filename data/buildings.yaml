# Catálogo de prédios. Conteúdo é dado, não código: para um tipo novo, adicione aqui.
# Contas de capacidade (a fonte de cada número está no comentário dele):
#   área construída = área do lote x coeficiente de aproveitamento (CA)
#   Zona Mista de SP (Lei 16.402/2016): CA básico 1, CA máximo 2; taxa de ocupação 0,85 (lote ≤ 500 m²) e 0,70 (lote > 500 m²).
#   Empregos = área útil / m² por emprego (Employment Density Guide, HCA 2015: escritório 12 m²,
#   varejo 15 m², indústria geral 36 m²). Área útil = 80% da construída (PENDENTE).
#   Apartamentos: 75% dos lançados em SP em 2024 tinham até 45 m² (Secovi-SP).
#   Andares (floors): área construída / (área do lote x taxa de ocupação), arredondado. Só muda o visual.
#   Obra de casa: 6 a 18 meses (média 12). Como 1 dia do jogo = 1 ano, 12 meses = 1 dia.
buildings:
  - id: casa
    floors: 1
    label: Casa
    zone: residential_low
    w: 1
    h: 1
    homes: 1
    constructionMonths: 12
    models: [suburban/building-type-a, suburban/building-type-b, suburban/building-type-c, suburban/building-type-d, suburban/building-type-e, suburban/building-type-f, suburban/building-type-g, suburban/building-type-h, suburban/building-type-i, suburban/building-type-j, suburban/building-type-k, suburban/building-type-l, suburban/building-type-m, suburban/building-type-n, suburban/building-type-o, suburban/building-type-p, suburban/building-type-q, suburban/building-type-r, suburban/building-type-s, suburban/building-type-t, suburban/building-type-u]
  - id: predio_residencial
    floors: 3
    label: Prédio residencial
    zone: residential_high
    w: 2
    h: 2
    # Lote 1.024 m² x CA 2 = 2.048 m²; 75% privativo / 45 m² = 34 apartamentos.
    homes: 34
    # PENDENTE: prazo de obra de prédio (usado 24 meses).
    constructionMonths: 24
    models: [commercial/building-a, commercial/building-b, commercial/building-c, commercial/building-d, commercial/building-e, commercial/building-f]
  - id: loja
    floors: 1
    label: Loja
    zone: commercial
    w: 1
    h: 1
    # Lote 256 m² x CA 1 = 256 m²; 80% útil / 15 m² = 13 empregos.
    jobs: 13
    constructionMonths: 9
    models: [commercial/low-detail-building-a, commercial/low-detail-building-b, commercial/low-detail-building-c, commercial/low-detail-building-d, commercial/low-detail-building-e, commercial/low-detail-building-f, commercial/low-detail-building-g, commercial/low-detail-building-h, commercial/low-detail-building-i, commercial/low-detail-building-j, commercial/low-detail-building-k, commercial/low-detail-building-l, commercial/low-detail-building-m, commercial/low-detail-building-n]
  - id: escritorio
    floors: 3
    label: Prédio comercial
    zone: commercial
    w: 2
    h: 2
    # Lote 1.024 m² x CA 2 = 2.048 m²; 80% útil / 12 m² = 136 empregos.
    jobs: 136
    constructionMonths: 24
    models: [commercial/building-g, commercial/building-h, commercial/building-i, commercial/building-j, commercial/building-k, commercial/building-l, commercial/building-m, commercial/building-n]
  - id: galpao
    floors: 2
    label: Galpão industrial
    zone: industrial
    w: 2
    h: 2
    # Lote 1.024 m² x taxa de ocupação 0,70 = 717 m² (1 pavimento) / 36 m² = 20 empregos.
    jobs: 20
    constructionMonths: 12
    models: [commercial/low-detail-building-wide-a, commercial/low-detail-building-wide-b]
  - id: escola
    floors: 1
    label: Escola (FNDE 12 salas)
    service: school
    # Terreno ideal 80 x 100 m (FNDE) = 5 x 6 quadradinhos.
    w: 5
    h: 6
    # Até 780 alunos em dois turnos (FNDE, Espaço Educativo Urbano 12 salas).
    students: 780
    # PENDENTE: professores e funcionários (24 turmas).
    jobs: 40
    # Exemplo de escola FNDE 12 salas com quadra: R$ 9,0 milhões (Itabaiana-SE).
    cost: 9000000
    # Custo por aluno por ano: VAAF-MIN do Fundeb 2024 = R$ 5.357,06.
    upkeepPerStudentPerYear: 5357
    # Prazo de obra com recurso federal: Resolução CD/FNDE nº 13/2011, art. 11 = 548 dias; 548 / 30 = 18,3 -> 18 meses - https://www.gov.br/fnde/pt-br/acesso-a-informacao/legislacao/resolucoes/2011/resolucao-cd-fnde-no-13-de-21-de-marco-de-2011
    constructionMonths: 18
    models: [proc/school]
  - id: ubs
    floors: 1
    label: UBS (posto de saúde)
    service: health
    w: 2
    h: 2
    # UBS Porte I abriga 1 equipe de Saúde da Família; cada equipe atende de 2.000 a 3.500 pessoas (PNAB 2017).
    patients: 3500
    # PENDENTE: equipe mínima (médico, enfermeiro, técnico, agentes comunitários).
    jobs: 8
    # Convênio de UBS Porte 1 no Novo PAC (2024): R$ 2,01 milhões.
    cost: 2012826
    # Custo anual da equipe: custo médio mensal de 1 eSF de R$ 154.088,23 x 12 = R$ 1.849.059 (Fiocruz, 56 U.A.P. analisadas) - https://arca.fiocruz.br/items/45d8359a-df7f-4500-b3c7-7277a8d02087
    upkeepPerYear: 1849059
    constructionMonths: 12
    models: [proc/clinic]
  - id: hospital
    floors: 2
    label: Hospital municipal
    service: health
    w: 4
    h: 3
    nearWater: 0
    # Portaria GM/MS 1.101/2002: 2,5 a 3 leitos para cada 1.000 habitantes; 90 leitos atendem cidade de 30 a 40 mil hab.
    patients: 90
    # PENDENTE: equipe mínima de hospital de ~100 leitos. Usado ~2 professionals por leito (médicos,
    # enfermeiros, técnicos e administrativo): 2 x 90 = 180.
    jobs: 180
    # Custo de obra: Hospital Regional de Belo Jardim (PE), 100 leitos por R$ 56 mi = 560 mil/leito; 560.000 x 90 = R$ 50.400.000 - https://belojardim.pe.gov.br/ordem-de-servico-e-assinada-para-inicio-das-obras-do-hospital-regional-de-belo-jardim-com-uti-100-leitos-e-investimento-de-r-56-milhoes/
    cost: 50400000
    # Custo anual por leito no SUS: gasto médio/internação de R$ 2.826 x 27,7 internações/leito/ano = R$ 78.280/leito/ano; 78.280 x 90 = R$ 7.045.200 (SIH/DATASUS 2025) - https://drpap.com.br/indicadores-hospitalares
    upkeepPerYear: 7045200
    # Prazo de obra: cronograma inicial do Hospital Público Estadual de Franca (SP): 1 prédio = 30 meses (MPD busca 24) - https://www.jornaldafranca.com.br/empresa-responsavel-pelo-hospital-do-estado-quer-encurtar-tempo-de-obra-pra-24-meses/
    constructionMonths: 30
    models: [proc/hospital]
  # Água, luz e esgoto. Consumo médio de água: 154 litros por pessoa por dia (SNIS/ANA, citado pela CNM:
  # https://cnm.org.br/comunicacao/noticias/brasileiro-consome-em-media-154-litros-de-agua-por-dia-aponta-onu).
  # Poço tubular profundo: 40% das sedes urbanas são abastecidas só por água subterrânea (Atlas Águas 2021, ANA).
  - id: poco
    floors: 1
    label: Poço artesiano
    service: water
    w: 1
    h: 1
    # PENDENTE: vazão típica de poço tubular urbano. Usado 20 L/s: 20 x 86.400 / 154 = ~11.200 pessoas.
    serves: 11200
    jobs: 2
    # Custo de perfuração e equipamento: orçamento-base SINAPI da Prefeitura de Piracema (MG) para construção de poço tubular = R$ 369.439,77 (perfuração + revestimento + desenvolvimento). Para o poço do jogo (20 L/s, 100 m) = ~4 x esse orçamento: 369.439,77 x 4 = 1.477.759 -> 1.500.000 - https://www.piracema.mg.gov.br/licitacao/download/3026
    cost: 1500000
    # Custo de operação: pessoal 2 operadores x R$ 6.000/mês x 12 = 144.000/ano (SNIS IN008, despesa média anual por empregado) + bombeamento e cloração. Custo medido de captação subterrânea em poço de 25 m³/h = R$ 0,077/m³ x 631.800 m³/ano (20 L/s) = 48.649/ano. Total = 144.000 + 48.649 = 192.649 -> 300.000/ano - https://www.gov.br/mdr/pt-br/assuntos/saneamento/snis https://aguassubterraneas.abas.org/asubterraneas/article/download/23313/15405/0
    upkeepPerYear: 300000
    constructionMonths: 6
    models: [proc/well]
  # Estação de tratamento de água: capta no rio ou lago (manancial superficial).
  - id: eta
    floors: 1
    label: Estação de tratamento de água
    service: water
    w: 3
    h: 3
    # PENDENTE: porte típico. Usado 100 L/s: 100 x 86.400 / 154 = ~56.000 pessoas.
    serves: 56000
    jobs: 15
    # Captação: a estação precisa ficar a até 3 quadradinhos (48 m) do rio ou lago.
    nearWater: 3
    # Custo de obra: custo unitário de ETA "novo" para vazão de 51 a 100 L/s = R$ 130.726,98/L/s (Plano de Negócios Referencial da concessão SAAES-PI, ANEXO VII, Tabela 24). 100 L/s x 130.726,98 = 13.072.698 -> 13.072.700 - https://suparc.sead.pi.gov.br/wp-content/uploads/2024/03/Conc-SAAES-PI-%E2%80%93-PNR_RCP.pdf
    cost: 13072700
    # Custo de operação, por ano, para 100 L/s = 3.153.600 m³/ano (100 x 86,4 x 365): energia 0,52 kWh/m³ x 3.153.600 x R$ 0,7164/kWh (tarifa média de saneamento, ANEEL/Equatorial GO, via Plano Microrregional de Esgotamento de GO) = 1.174.804; produtos químicos (sulfato de alumínio 35 mg/L x R$ 3,00/kg, flúor 0,7 mg/L x R$ 5,00/kg, cal 10 mg/L x R$ 0,70/kg, cloro 2 mg/L x R$ 2,60/kg, polímero 0,8 mg/L x R$ 2,00/kg = R$ 0,1223/m³) x 3.153.600 = 385.685; pessoal 15 operadores x R$ 6.000/mês x 12 = 1.080.000. Total = 1.174.804 + 385.685 + 1.080.000 = 2.640.489 -> 2.640.490 - https://goias.gov.br/seinfra/wp-content/uploads/sites/6/2025/07/ANEXO_C___RELATORIO_DE_PREMISSAS-1.pdf https://rgsa.openaccesspublications.org/rgsa/article/download/12006/6655 https://suparc.sead.pi.gov.br/wp-content/uploads/2024/03/Conc-SAAES-PI-%E2%80%93-PNR_RCP.pdf
    upkeepPerYear: 2640490
    constructionMonths: 24
    models: [proc/eta]
  # Subestação de distribuição de energia. No Brasil a rede é da distribuidora (concessionária); no
  # jogo o prefeito escolhe onde ela fica e paga a obra. Consumo residencial médio: 179 kWh por mês por
  # domicílio (EPE, 2022).
  - id: subestacao
    floors: 1
    label: Subestação de energia
    service: power
    w: 2
    h: 2
    # PENDENTE: porte típico (usado 10 MVA). 179 kWh/mês = 0,25 kW médio por domicílio; com pico de 2x
    # dá ~0,5 kW. 10 MVA x 0,9 / 0,5 kW = 18.000 domicílios = ~50.000 pessoas.
    serves: 50000
    jobs: 4
    # Custo de obra: Subestação Monte Verde (Celesc, Florianópolis, 40 MVA) = R$ 39,03 milhões. Por MVA: 39.030.000 / 40 = 975.750; 10 MVA x 975.750 = 9.757.500 - https://www.santacatarinaempauta.com.br/2025/04/16/celesc-inauura-subestacao-monte-verde-para-atender-a-20-mil-unidades-consumidoras-em-florianopolis/
    cost: 9757500
    # Custo de operação: pessoal 4 x R$ 6.000/mês x 12 = 288.000 (SNIS IN008) + manutenção = 0,5% do CAPEX ao ano (premissa do Plano Microrregional de Esgotamento de GO): 0,005 x 9.757.500 = 48.788. Total = 288.000 + 48.788 = 336.788 -> 336.800 - https://www.gov.br/mdr/pt-br/assuntos/saneamento/snis https://goias.gov.br/seinfra/wp-content/uploads/sites/6/2025/07/ANEXO_C___RELATORIO_DE_PREMISSAS-1.pdf
    upkeepPerYear: 336800
    constructionMonths: 18
    models: [proc/substation]
  # Estação de tratamento de esgoto: trata o esgoto coletado e despeja o efluente tratado no rio ou lago.
  - id: ete
    floors: 1
    label: Estação de tratamento de esgoto
    service: sewage
    w: 3
    h: 3
    # PENDENTE: porte típico de ETE urbana. Usado 50.000 (mesma ordem da ETA de 100 L/s).
    serves: 50000
    # A ETE despeja o efluente tratado no rio/lago, como a ETA capta: precisa ficar a até 3 quadradinhos dele.
    nearWater: 3
    # PENDENTE: equipe de operação de ETE de porte médio.
    jobs: 10
    # Custo de obra: custo unitário de ETE "tratamento secundário" para vazão de 26 a 50 L/s = R$ 276.048,19/L/s (Relatório de Premissas do Plano Microrregional de Esgotamento Sanitário de Goiás, Tabela 7). 50 L/s x 276.048,19 = 13.802.410 -> 13.802.400 - https://goias.gov.br/seinfra/wp-content/uploads/sites/6/2025/07/ANEXO_C___RELATORIO_DE_PREMISSAS-1.pdf
    cost: 13802400
    # Custo de operação, por ano, para 50 L/s = 1.576.800 m³/ano (50 x 86,4 x 365): energia 0,33 kWh/m³ (lodo ativado, CEEE) x 1.576.800 x R$ 0,7164/kWh = 372.774; produtos químicos (PAC R$ 0,24/m³ + polímero R$ 0,0375/m³) x 1.576.800 = 437.562; lodo 0,12 m³/hab.ano x 30% de remoção x R$ 108,29/m³ = R$ 3,90/hab.ano x 50.000 = 195.000; pessoal 10 x R$ 6.000/mês x 12 = 720.000. Total = 372.774 + 437.562 + 195.000 + 720.000 = 1.725.336 -> 1.725.340 - https://goias.gov.br/seinfra/wp-content/uploads/sites/6/2025/07/ANEXO_C___RELATORIO_DE_PREMISSAS-1.pdf https://rgsa.openaccesspublications.org/rgsa/article/download/12006/6655
    upkeepPerYear: 1725340
    # Prazo de obra: ETE Centenário (Samae, Jaraguá do Sul/SC) = 840 dias de execução; 840 / 30 = 28 meses - https://www.samaejs.com.br/noticias/assinada-ordem-de-servico-para-o-inicio-da-obra-da-nova-estacao-de-tratamento-de-esgoto-no-centenario/
    constructionMonths: 28
    models: [proc/eta]
